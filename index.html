<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <!--=============== GOOGLE FONTS ===============-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Text&family=DM+Sans:opsz,wght@9..40,100..1000&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <title>Terminal-v2</title>
  </head>
  <body>
    <div class="modal">
      <form class="add-form" action="">
        <textarea class="text-from-pdf" name="" id=""> </textarea>
        <button class="save">Save</button>
        <button class="close-modal">Close</button>
      </form>
    </div>
    <div class="container">
      <div class="btn-wrapper">
        <button class="add-data">Add data</button>
        <button class="all">All</button>
        <button class="filter">Filter</button>
        <button class="notesBtn">Notes</button>
      </div>
      <div class="notes">
        <textarea class="notes__area" name="" id=""></textarea>
      </div>
      <ul class="table"></ul>
    </div>
    <script src="script.js"></script>
  </body>
</html>
